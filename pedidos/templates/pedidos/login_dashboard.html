<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Buffet</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; font-family: sans-serif; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        input[type="password"] { font-size: 24px; padding: 10px; width: 150px; text-align: center; letter-spacing: 5px; margin-bottom: 20px; }
        button { background-color: #0d6efd; color: white; border: none; padding: 10px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        .error { color: red; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Ingreso al Panel</h2>
        <p>Por favor, ingresá el PIN de seguridad.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="password" name="pin" maxlength="4" required autofocus autocomplete="off">
            <br>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
