<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al panel | SterakFood</title>
    <style>
        * { box-sizing:border-box; }
        body { display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;background:#0a0b0d;color:#f8f9fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
        .login-box { width:min(440px,100%);background:#16181c;border:1px solid #2a2d32;border-top:3px solid #ff6600;border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.4);padding:35px 32px;text-align:center; }
        .marca { font-size:1.4rem;font-weight:900;color:#ff6600;letter-spacing:.02em; }
        h1 {font-size:1.8rem;margin:14px 0 8px;}
        p {color:#b3b8bd;font-size:.95rem;margin:0 0 25px;}
        label {display:block;text-align:left;font-size:.85rem;color:#c9cdd1;margin-bottom:8px;font-weight:700;}
        input[type=password] {display:block;width:100%;height:54px;background:#0a0b0d;border:1px solid #41454c;color:white;border-radius:10px;font-size:1.5rem;letter-spacing:.28em;text-align:center;margin:0 0 18px;outline:none;}
        input[type=password]:focus {border-color:#ff6600;box-shadow:0 0 0 3px rgba(255,102,0,.15);}
        button {background:#ff6600;color:#101010;border:0;border-radius:10px;padding:14px 22px;width:100%;font-weight:850;font-size:1rem;cursor:pointer;}
        button:hover {background:#ff8533;}
        .error {margin:0 0 18px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#ff9191;border-radius:8px;padding:11px;font-size:.9rem;}
    </style>
</head>
<body>
    <section class="login-box">
        <div class="marca">SterakFood</div>
        <h1>Ingreso al Panel</h1>
        <p>Ingresá el PIN de seguridad.</p>
        {% if messages %}{% for message in messages %}<div class="error" role="alert">{{ message }}</div>{% endfor %}{% endif %}
        <form method="post">
            {% csrf_token %}
            {% if destino_salon %}<input type="hidden" name="next" value="{% url 'pedidos:salon' %}">{% endif %}
            <label for="pin">PIN</label>
            <input id="pin" type="password" name="pin" inputmode="numeric" maxlength="12" required autofocus autocomplete="off">
            <button type="submit">Ingresar</button>
        </form>
    </section>
</body>
</html>
