<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Confirmado!</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .contenedor { background: white; padding: 40px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .numero-orden { font-size: 24px; font-weight: bold; color: #e67e22; margin: 20px 0; }
        .btn-whatsapp { display: inline-block; background-color: #25D366; color: white; padding: 15px 30px; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 5px; margin-top: 20px; transition: background 0.3s; }
        .btn-whatsapp:hover { background-color: #128C7E; }
        .total { font-size: 20px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>¡Tu pedido está registrado! 🎉</h1>
        <p>El backend de la app ya guardó tu orden con éxito.</p>
        
        <div class="numero-orden">Orden: #{{ pedido.id }}</div>
        
        <p class="total">Total a pagar en mostrador: ${{ pedido.total }}</p>
        
        <p>Para que empecemos a prepararlo, tocá el botón de abajo para enviarnos el detalle por WhatsApp:</p>
        
        <a href="{{ link_whatsapp }}" target="_blank" class="btn-whatsapp">
            📱 Enviar Pedido por WhatsApp
        </a>
    </div>

</body>
</html>
